!DOCTYPE html>
<html lang="en">
    <head>
        <title>Multipliction</title>
       
        <h1>Multipliction table of 7</h1>
         
        </head>
        <body>
    <script>
        let num = 7;
        for(let i = 1; i <=10; i++){
            console.log(num + " * " + i + " = " + (num * i));
        }
    </script>
    </body>
</html>
