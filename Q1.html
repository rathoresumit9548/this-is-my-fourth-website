<!DOCTYPE html>
<html lang="en"
    <head>
    <title>REVERSE NUMBER</title>
  
     <h1>Reverse Number</h1>
    </head>
      
         <body>  
        <script>
            let i = 1;
            for(let i = 10; i >=1; i--){
                console.log(i);
            }
        </script>
    </body>
</html>
