<!DOCTYPE html>
<html lang="en">

        <title>Even number</title>

    <h1>EVEN NUMBER</h1>
   
    <body>
        <script>
            let i = 20;
             for(let i = 1; i <= 20; i++){
                if(i % 2 === 0){
                    console.log(i);
                }
             }
        </script>
    </body>
