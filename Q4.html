<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ODD NUMBER</title>
    </head>
    <h1>ODD Numbers</h1>
    <body>
        <script>
            let i = 25;
            for(let i = 1; i <= 25; i++){
                if(i % 2!== 0){
                    console.log(i);
                }
            }
        </script>
    </body>
</html>
